apiVersion: v1
kind: Secret
metadata:
  name: ovh-credentials
  namespace: cert-manager
type: Opaque 
data:
  applicationKey: {{ .Values.ovh.applicationKey | b64enc }}
  applicationSecret: {{ .Values.ovh.applicationSecret | b64enc }}
  consumerKey: {{ .Values.ovh.consumerKey | b64enc }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-webhook-ovh-secret-reader
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ovh-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-ovh-secret-reader
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-webhook-ovh-secret-reader
subjects:
  - kind: ServiceAccount
    name: cert-manager-cert-manager-webhook-ovh
    namespace: cert-manager
