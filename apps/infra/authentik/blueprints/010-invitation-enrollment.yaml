# yaml-language-server: $schema=https://version-2026-8.goauthentik.io/blueprints/schema.json
#
# This blueprint defines the enrollment mechanisms. It deliberately does not
# create invitations: invitation tokens are short-lived operational secrets and
# should be generated through the Authentik API when a person needs access.
#
# Each flow has a different User Write stage so the invitation creator chooses
# the user's initial group by choosing the corresponding flow.
version: 1
metadata:
  name: Homelab invitation enrollment
  labels:
    blueprints.goauthentik.io/description: |
      Invitation enrollment for administrators, operators, and regular users.

entries:
  - model: authentik_core.group
    state: present
    id: homelab-admins
    identifiers:
      name: homelab-admins
    attrs:
      is_superuser: true

  - model: authentik_core.group
    state: present
    id: homelab-operators
    identifiers:
      name: homelab-operators
    attrs:
      is_superuser: false

  - model: authentik_core.group
    state: present
    id: homelab-users
    identifiers:
      name: homelab-users
    attrs:
      is_superuser: false

  - model: authentik_flows.flow
    state: present
    id: enrollment-admin
    identifiers:
      slug: homelab-enrollment-admin
    attrs:
      name: Homelab enrollment - administrator
      title: Create your administrator account
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_flows.flow
    state: present
    id: enrollment-operator
    identifiers:
      slug: homelab-enrollment-operator
    attrs:
      name: Homelab enrollment - operator
      title: Create your operator account
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_flows.flow
    state: present
    id: enrollment-user
    identifiers:
      slug: homelab-enrollment-user
    attrs:
      name: Homelab enrollment - user
      title: Create your user account
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_stages_invitation.invitationstage
    state: present
    id: invitation-stage-admin
    identifiers:
      name: homelab-enrollment-invitation-admin
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_stages_invitation.invitationstage
    state: present
    id: invitation-stage-operator
    identifiers:
      name: homelab-enrollment-invitation-operator
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_stages_invitation.invitationstage
    state: present
    id: invitation-stage-user
    identifiers:
      name: homelab-enrollment-invitation-user
    attrs:
      continue_flow_without_invitation: false

  - model: authentik_stages_prompt.prompt
    state: present
    id: prompt-username
    identifiers:
      name: homelab-enrollment-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      order: 0

  - model: authentik_stages_prompt.prompt
    state: present
    id: prompt-password
    identifiers:
      name: homelab-enrollment-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      order: 1

  - model: authentik_stages_prompt.prompt
    state: present
    id: prompt-password-repeat
    identifiers:
      name: homelab-enrollment-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      order: 2

  - model: authentik_stages_prompt.prompt
    state: present
    id: prompt-name
    identifiers:
      name: homelab-enrollment-name
    attrs:
      field_key: name
      label: Name
      type: text
      required: true
      placeholder: Name
      order: 0

  - model: authentik_stages_prompt.prompt
    state: present
    id: prompt-email
    identifiers:
      name: homelab-enrollment-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      order: 1

  - model: authentik_stages_prompt.promptstage
    state: present
    id: prompt-stage-credentials
    identifiers:
      name: homelab-enrollment-credentials
    attrs:
      fields:
        - !KeyOf prompt-username
        - !KeyOf prompt-password
        - !KeyOf prompt-password-repeat

  - model: authentik_stages_prompt.promptstage
    state: present
    id: prompt-stage-details
    identifiers:
      name: homelab-enrollment-details
    attrs:
      fields:
        - !KeyOf prompt-name
        - !KeyOf prompt-email

  - model: authentik_stages_user_write.userwritestage
    state: present
    id: user-write-admin
    identifiers:
      name: homelab-enrollment-user-write-admin
    attrs:
      user_creation_mode: always_create
      user_type: internal
      user_path_template: users/internal
      create_users_group: !KeyOf homelab-admins

  - model: authentik_stages_user_write.userwritestage
    state: present
    id: user-write-operator
    identifiers:
      name: homelab-enrollment-user-write-operator
    attrs:
      user_creation_mode: always_create
      user_type: internal
      user_path_template: users/internal
      create_users_group: !KeyOf homelab-operators

  - model: authentik_stages_user_write.userwritestage
    state: present
    id: user-write-user
    identifiers:
      name: homelab-enrollment-user-write-user
    attrs:
      user_creation_mode: always_create
      user_type: internal
      user_path_template: users/internal
      create_users_group: !KeyOf homelab-users

  - model: authentik_stages_user_login.userloginstage
    state: present
    id: user-login
    identifiers:
      name: homelab-enrollment-user-login

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-admin
      stage: !KeyOf invitation-stage-admin
      order: 5
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-admin
      stage: !KeyOf prompt-stage-credentials
      order: 10

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-admin
      stage: !KeyOf prompt-stage-details
      order: 15

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-admin
      stage: !KeyOf user-write-admin
      order: 20

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-admin
      stage: !KeyOf user-login
      order: 100

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-operator
      stage: !KeyOf invitation-stage-operator
      order: 5
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-operator
      stage: !KeyOf prompt-stage-credentials
      order: 10

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-operator
      stage: !KeyOf prompt-stage-details
      order: 15

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-operator
      stage: !KeyOf user-write-operator
      order: 20

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-operator
      stage: !KeyOf user-login
      order: 100

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-user
      stage: !KeyOf invitation-stage-user
      order: 5
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-user
      stage: !KeyOf prompt-stage-credentials
      order: 10

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-user
      stage: !KeyOf prompt-stage-details
      order: 15

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-user
      stage: !KeyOf user-write-user
      order: 20

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf enrollment-user
      stage: !KeyOf user-login
      order: 100
