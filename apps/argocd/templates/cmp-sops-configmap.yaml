apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-sops
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops
    spec:
      version: v1.0
      allowConcurrency: true
      init:
        command: [bash, -c]
        args:
          - |
            find . -type f -name 'enc.*.yaml' | while read file; do
              dir=$(dirname "$file")
              base=$(basename "$file")
              dec_name="${base#enc.}"
              sops -d "$file" > "$dir/$dec_name"
            done
            helm dependency update 
      generate:
        command: [bash, -c]
        args:
          - |
            helm template ${RELEASE} . ${HELM_EXTRA_ARGS}
