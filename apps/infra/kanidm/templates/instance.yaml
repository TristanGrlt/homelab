apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: {{ .Values.kanidm.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  domain: {{ .Values.kanidm.domain }}
  origin: {{ .Values.kanidm.origin }}
  tlsSecretName: {{ .Values.tls.secretName }}
  oauth2ClientNamespaceSelector: {}
  replicaGroups:
    - name: default
      replicas: 1
      primaryNode: true
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.kanidm.storageSize }}
