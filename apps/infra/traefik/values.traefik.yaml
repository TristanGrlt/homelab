traefik:
  providers:
    kubernetesGateway:
      enabled: true

  gateway:
    namespacePolicy: All
    enabled: false

  gatewayClass:
    enabled: false

  ports:
    web:
      port: 80
      exposedPort: 80
      expose:
        default: true
      nodePort: 30080

    websecure:
      port: 443
      exposedPort: 443
      expose:
        default: true
      nodePort: 30443

  securityContext:
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  service:
    type: NodePort
