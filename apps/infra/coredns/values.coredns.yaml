coredns:
  replicaCount: 2

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/allow-shared-ip: coredns

  servers:
    - zones:
        - zone: .
          scheme: dns://
          use_tcp: true
        - zone: home.grltt.fr
          scheme: dns://
          use_tcp: true

      port: 53

      plugins:
        - name: errors

        - name: health
          configBlock: |-
            lameduck 5s

        - name: ready

        - name: template
          parameters: IN A home.grltt.fr
          configBlock: |-
            match ^([a-z0-9-]+)\.home\.grltt\.fr\.$
            answer "{{ .Name }} 60 IN A 192.168.1.20"

        - name: forward
          parameters: . 1.1.1.1 1.0.0.1

        - name: cache
          parameters: 30

        - name: loop

        - name: reload

        - name: loadbalance

  servicePorts:
    dns:
      enabled: true
      port: 53
      protocol: UDP

    dns-tcp:
      enabled: true
      port: 53
      protocol: TCP
