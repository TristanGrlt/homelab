argo-cd:
  dex:
    enabled: false

  server:
    ingress:
      enabled: false

  configs:
    params:
      server.insecure: "true"
    cm:
      url: https://argocd.argocd.home.grltt.fr
      oidc.config: |
        name: Kanidm
        issuer: https://auth.grltt.fr/oauth2/openid/argocd
        clientID: $argocd-kanidm-oauth2-credentials:client-id 
        clientSecret: $argocd-kanidm-oauth2-credentials:client-secret
        requestedScopes:
          - openid
          - profile
          - email
          - groups
        requestedIDTokenClaims:
          groups:
            essential: true

    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, admins@auth.grltt.fr, role:admin
      scopes: '[groups, email]'

  repoServer:
    volumes:
      - name: cmp-plugin
        configMap:
          name: cmp-sops
      - name: sops-key
        secret:
          secretName: sops-age-key
      - name: custom-tools
        emptyDir: {}

    initContainers:
      - name: install-sops
        image: alpine:3.19
        securityContext:
          runAsUser: 0
        command: [sh, -c]
        args:
          - |
            apk add --no-cache curl ca-certificates
            curl -sL -o /custom-tools/sops https://github.com/getsops/sops/releases/download/v3.8.1/sops-v3.8.1.linux.amd64
            chmod +x /custom-tools/sops
        volumeMounts:
          - mountPath: /custom-tools
            name: custom-tools

    extraContainers:
      - name: cmp-sops
        image: quay.io/argoproj/argocd:v2.10.5
        command: [/var/run/argocd/argocd-cmp-server]
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
        env:
          - name: SOPS_AGE_KEY_FILE
            value: /sops-key/keys.txt
        volumeMounts:
          - mountPath: /var/run/argocd
            name: var-files
          - mountPath: /home/argocd/cmp-server/plugins
            name: plugins
          - mountPath: /tmp
            name: tmp
          - mountPath: /home/argocd/cmp-server/config/plugin.yaml
            subPath: plugin.yaml
            name: cmp-plugin
          - mountPath: /usr/local/bin/sops
            subPath: sops
            name: custom-tools
          - mountPath: /sops-key
            name: sops-key
            readOnly: true
