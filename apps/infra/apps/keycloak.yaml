apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TristanGrlt/homelab.git
    targetRevision: HEAD
    path: apps/infra/keycloak
    plugin:
      name: sops-v1.0
      env:
        - name: RELEASE
          value: cert-manager
        - name: HELM_EXTRA_ARGS
          value: "-f values.keycloak.yaml -f keycloak.values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
