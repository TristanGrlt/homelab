apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TristanGrlt/homelab.git
    targetRevision: HEAD
    path: apps/infra/cert-manager
    plugin:
      name: sops
      env:
        - name: RELEASE
          value: cert-manager
        - name: HELM_EXTRA_ARGS
          value: "-f values.cert-manager.yaml -f cert-manager.values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
