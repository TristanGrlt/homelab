# yaml-language-server: $schema=https://version-2026-8.goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: custom-mfa-totp-selected-policy
entries:
  - model: authentik_policies_expression.expressionpolicy
    state: present
    id: custom-mfa-totp-selected
    identifiers:
      name: custom-mfa-totp-selected
    attrs:
      expression: |
        return context.get("prompt_data", {}).get("mfa_method") == "totp"
