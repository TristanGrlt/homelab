apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps2apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TristanGrlt/homelab.git
    targetRevision: HEAD
    path: apps/argocd/apps2apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
