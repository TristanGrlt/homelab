# yaml-language-server: $schema=https://version-2026-8.goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: custom-enrollment-admin-policy-bindings
entries:
  - model: authentik_policies.policybinding
    state: present
    id: custom-enrollment-admin-policy-totp
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, custom-mfa-totp-selected]]
      target: !Find
        - authentik_flows.flowstagebinding
        - [target, !Find [authentik_flows.flow, [slug, custom-enrollment-admin]]]
        - [stage, !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, custom-mfa-totp]]]
        - [order, 30]
      order: 0
    attrs:
      enabled: true
      negate: false

  - model: authentik_policies.policybinding
    state: present
    id: custom-enrollment-admin-policy-webauthn
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, custom-mfa-webauthn-selected]]
      target: !Find
        - authentik_flows.flowstagebinding
        - [target, !Find [authentik_flows.flow, [slug, custom-enrollment-admin]]]
        - [stage, !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, custom-mfa-webauthn]]]
        - [order, 40]
      order: 0
    attrs:
      enabled: true
      negate: false
