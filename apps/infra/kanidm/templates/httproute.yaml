apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.kanidm.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      {{- if .Values.gateway.sectionName }}
      sectionName: {{ .Values.gateway.sectionName }}
      {{- end }}
  hostnames:
    - {{ .Values.kanidm.domain }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.kanidm.name }}
          port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Values.kanidm.name }}-backend-tls
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.kanidm.name }}
  validation:
    hostname: {{ .Values.kanidm.domain }}
    {{- if .Values.tls.caConfigMapName }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ .Values.tls.caConfigMapName }}
    {{- else }}
    wellKnownCACertificates: System
    {{- end }}
