coredns:
  replicaCount: 2

  serviceType: LoadBalancer

  service:
    externalTrafficPolicy: Local

  servers:
    - zones:
        - zone: .
          use_tcp: true
      port: 53
      plugins:
        - name: errors

        - name: health
          configBlock: |-
            lameduck 5s

        - name: ready

        - name: template
          parameters: "IN A home.grltt.fr"
          configBlock: |-
            match ^([a-z0-9-]+)\.home\.grltt\.fr\.$
            answer "{{ .Name }} 60 IN A 192.168.1.24"

        - name: forward
          parameters: ". 1.1.1.1 1.0.0.1"

        - name: cache
          parameters: "30"

        - name: loop
        - name: reload
        - name: loadbalance
